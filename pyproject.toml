[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flyecho"
version = "0.2.0"
description = "Drosophila-connectome-inspired active ultrasonic sensing"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "David Mariscal Fernández"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
hardware = ["pyserial>=3.5"]
simulation = [
  "brian2>=2.9,<2.10; python_version < '3.12'",
  "numpy>=1.23.5,<2.0; python_version < '3.12'",
  "brian2>=2.10.1; python_version >= '3.12'",
]
connectome = [
  "navis>=1.12.0",
  "neuprint-python>=0.6.3",
]

[project.scripts]
flyecho = "flyecho.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
