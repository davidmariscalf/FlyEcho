[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flyecho"
version = "0.1.0"
description = "Drosophila-connectome-inspired active ultrasonic sensing"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "David Mariscal Fernández"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
hardware = ["pyserial>=3.5"]

[project.scripts]
flyecho = "flyecho.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
